<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">

  <title>
    {% if page.title and page.title != "首页" %}
      {{ page.title }} &middot; {{ site.title }}
    {% else %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% endif %}
  </title>

  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="{{ site.author.name }}">

  {% if page.url %}
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  {% endif %}

  <!-- Base Poole & Lanyon Styles -->
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/poole.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/syntax.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/lanyon.css">

  <!-- Modern Design System & Dark Mode Overhaul -->
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/modern.css">

  <link rel="shortcut icon" href="{{ site.baseurl }}/public/favicon.ico">

  {% if site.posts.size > 0 %}
    <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ site.baseurl }}/atom.xml">
  {% endif %}
</head>
