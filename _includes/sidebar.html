<!-- Toggle Checkbox -->
<input type="checkbox" class="sidebar-checkbox" id="sidebar-checkbox">

<!-- Modernized Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-avatar">HF</div>
    <div class="sidebar-title">{{ site.title }}</div>
    <div class="sidebar-bio">{{ site.tagline }}</div>
  </div>

  <nav class="sidebar-nav">
    <a class="sidebar-nav-item{% if page.url == '/' or page.url == '/index.html' %} active{% endif %}" href="{{ site.baseurl }}/">
      <span class="nav-icon">🏠</span> 首页
    </a>
    <a class="sidebar-nav-item" href="{{ site.baseurl }}/#articles">
      <span class="nav-icon">📝</span> 博客文章
    </a>
    <a class="sidebar-nav-item" href="{{ site.baseurl }}/#projects">
      <span class="nav-icon">🚀</span> 开源项目
    </a>
    <a class="sidebar-nav-item" href="{{ site.baseurl }}/#about">
      <span class="nav-icon">🧭</span> 关于与轨迹
    </a>

    <div class="sidebar-divider"></div>

    <a class="sidebar-nav-item" href="https://github.com/hfly2019" target="_blank" rel="noopener noreferrer">
      <span class="nav-icon">🐙</span> GitHub @hfly2019
    </a>
  </nav>

  <div class="sidebar-footer">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}.<br><span class="footer-sub">Built with Passion & Jekyll</span></p>
  </div>
</div>
