<!DOCTYPE html>
<html lang="zh-CN">

  {% include head.html %}

  <body>

    {% include sidebar.html %}

    <div class="wrap">
      <header class="masthead">
        <div class="container masthead-inner">
          <div class="masthead-brand">
            <a href="{{ site.baseurl }}/" class="site-title">{{ site.title }}</a>
            <span class="site-status"><span class="status-dot"></span>Exploring</span>
          </div>
          <nav class="masthead-nav">
            <a href="{{ site.baseurl }}/#articles">文章</a>
            <a href="{{ site.baseurl }}/#projects">项目</a>
            <a href="{{ site.baseurl }}/#about">关于</a>
            <a href="https://github.com/hfly2019" target="_blank" rel="noopener" class="nav-gh">GitHub</a>
          </nav>
        </div>
      </header>

      <main class="container content" id="main-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="container footer-content">
          <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} · 数字游民 · 用代码探索边界</p>
          <p class="footer-links">
            <a href="https://github.com/hfly2019" target="_blank" rel="noopener">GitHub @hfly2019</a>
            <span>&middot;</span>
            <a href="https://blog.nodehub.me">blog.nodehub.me</a>
          </p>
        </div>
      </footer>
    </div>

    <label for="sidebar-checkbox" class="toggle" title="切换菜单" aria-label="切换侧边栏菜单"></label>
    <script>
      (function(document) {
        var toggle = document.querySelector('.toggle'),
            wrap = document.querySelector('.wrap');

        if (toggle) {
          toggle.addEventListener('click', function(e) {
            e.preventDefault();
            var chk = document.getElementById('sidebar-checkbox');
            if (chk) chk.checked = !chk.checked;
          });
        }

        if (wrap) {
          wrap.addEventListener('click', function(e) {
            var chk = document.getElementById('sidebar-checkbox');
            if (chk && chk.checked && window.innerWidth < 768) {
              chk.checked = false;
            }
          });
        }
      })(document);
    </script>
  </body>
</html>
