---
layout: default
---

<article class="post">
  <header class="post-header">
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}" class="post-date">
        📅 {{ page.date | date: "%Y年%m月%d日" }}
      </time>
      {% if page.tags %}
        <span class="post-tags">
          {% for tag in page.tags %}
            <span class="tag-badge">#{{ tag }}</span>
          {% endfor %}
        </span>
      {% endif %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}
      <p class="post-lead">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <div class="post-nav-back">
      <a href="{{ site.baseurl }}/#articles" class="btn-back">← 返回文章列表</a>
      <a href="https://github.com/hfly2019" target="_blank" rel="noopener" class="btn-gh">关注 GitHub</a>
    </div>
  </footer>
</article>
